apiVersion: apps/v1
kind: Deployment
metadata:
  name: w110-app
  labels:
    app: w110-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: w110-app
  template:
    metadata:
      labels:
        app: w110-app
    spec:
      containers:
        - name: w110-app
          image: ghcr.io/srushtigadale143/w110-app:e2dc0c1
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
